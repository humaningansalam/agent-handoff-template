[project]
name = "agent-handoff-template-workspace"
version = "0.15.2"
description = "Workspace control-plane tooling for the agent handoff template"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# AST navigation is a plug-in enhancement; core Task/Knowledge/Graph reads
# continue without a compiled language parser installed.
structural = ["tree-sitter-language-pack>=0.12,<1"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["tools*"]

[dependency-groups]
dev = [
  "pytest>=9.0.3"
]
