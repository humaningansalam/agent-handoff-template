name: agent-handoff-template release
on:
  push:
    tags: [v1.0.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v1.0.0"
      - name: Verify release boundary and reproducible bytes
        run: python3 .github/scripts/build_release_archive.py
      - name: Publish immutable release and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: agent-handoff-template-1.0.0.tar.gz
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "dist/$ASSET" --verify-tag --title "agent-handoff-template $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          fi
          mkdir -p redownload
          gh release download "$GITHUB_REF_NAME" --pattern "$ASSET" --dir redownload
          test "$(sha256sum "redownload/$ASSET" | cut -d' ' -f1)" = "$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ASSET" \
            --output "redownload/public-$ASSET"
          test "$(sha256sum "redownload/public-$ASSET" | cut -d' ' -f1)" = "$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
