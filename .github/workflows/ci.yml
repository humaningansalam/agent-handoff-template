name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify document-only starter files
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f docs/PRD.md
          test -f docs/REPOS.md
          test -f docs/BOARD.md
          test -f docs/tasks/TEMPLATE.md
          test ! -e tools/repoctl
          test ! -e scripts/repoctl
