name: 기능 제안
description: 문서 작성과 인계에서 줄이고 싶은 혼동·반복을 제안합니다.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 문서 전용 템플릿입니다.
        필드나 절차를 늘리기 전에 실제 작성·인계 상황의 문제를 설명해 주세요.
        특정 구현 방식보다 실제 사용 흐름을 설명해 주세요. 한국어 또는 영어로 작성할 수 있습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      placeholder: |
        어떤 상황에서:
        현재의 불편 또는 반복 비용:
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과와 사용 예시
      placeholder: |
        현재:
        원하는 결과:
        결과를 확인할 수 있는 구체적인 사용 예시:
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 우회 방법과 유지해야 할 조건
      description: 현재 작성 방식과 유지해야 할 문서 호환성·간결성 조건만 적어 주세요. 특정 도구나 모델 사용을 전제하지 않습니다.
