name: 문서·양식 문제 신고
description: Task·Board·Handoff 문서나 작성 안내의 문제를 신고합니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 문서 작성 계약을 관리합니다. 한국어 또는 영어로 작성할 수 있습니다.
        repoctl 명령 실행, Graph·Knowledge 결과, 종료 검사 문제는 별도 repoctl 저장소에 남겨 주세요.
        비공개 Task 전체나 개인정보 대신 문제를 보여 주는 최소 문장·예시만 적어 주세요.
  - type: textarea
    id: behavior
    attributes:
      label: 문제와 기대하는 작성 결과
      placeholder: |
        사용한 문서 또는 필드:
        현재 안내대로 작성했을 때 생긴 혼동·누락:
        기대하는 결과:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 문제가 드러나는 최소 예시
      description: 어떤 안내를 따라 무엇을 작성하거나 인계했는지 적어 주세요. 단순 문구·링크 오류는 해당 위치와 설명으로 충분합니다.
      placeholder: |
        관련 경로 또는 링크:
        문제가 있는 문장:
        최소 작성 예시 또는 인계 상황:
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 버전과 관련 사용 환경
      description: template 버전·커밋과 실제로 관련된 환경만 적어 주세요. 문서 문제에 Python·OS 정보를 필수로 요구하지 않습니다.
      placeholder: |
        template 버전 또는 커밋:
        문서를 가져온 위치:
        렌더러·외부 도구(문제와 관련된 경우만):
  - type: textarea
    id: evidence
    attributes:
      label: 추가 참고 자료
      description: 관련 문서나 익명화한 최소 예시가 있다면 적어 주세요. 해결 방법 제안은 선택 사항입니다.
